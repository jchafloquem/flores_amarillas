<!-- Arreglo de flores amarillas: ramo de flores amarillas tipo girasol con        -->
<!-- tallos, hojas, florero de vidrio con agua, lazo y pétalos cayendo.            -->
<!-- La marca y los estilos del arreglo viven en este mismo archivo (app.html).    -->
<!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * -->

<style>
  /* ==========================================================
     Escenario
     ========================================================== */
  .pagina {
    --amarillo-claro: #fff7c9;
    --amarillo: #ffd93d;
    --amarillo-fuerte: #f7b500;
    --ambar: #e08a00;
    --tinta: #4a3208;
    --verde: #4e8b2e;
    position: relative;
    box-sizing: border-box;
    min-height: 100dvh;
    margin: 0;
    padding: clamp(0.75rem, 3vh, 2rem) 1rem clamp(0.5rem, 2vh, 1.25rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: clamp(0.35rem, 1.5vh, 1.25rem);
    overflow: hidden;
    background: radial-gradient(
      circle at 50% 4%,
      #fffdf2 0%,
      #fff4c0 26%,
      #ffe79c 52%,
      #ffd97a 78%,
      #f7bf46 100%
    );
    color: var(--tinta);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Rayo de luz que entra desde arriba */
  .pagina::before {
    content: '';
    position: absolute;
    top: -25%;
    left: -15%;
    right: -15%;
    height: 75%;
    background: radial-gradient(
      ellipse at 50% 0%,
      rgba(255, 255, 255, 0.9),
      rgba(255, 255, 255, 0) 62%
    );
    pointer-events: none;
  }

  /* Resplandor cálido a ras del suelo */
  .pagina::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 24%;
    background: radial-gradient(
      ellipse at 50% 100%,
      rgba(214, 154, 24, 0.3),
      rgba(214, 154, 24, 0) 70%
    );
    pointer-events: none;
  }

  /* ==========================================================
     Carta con el mensaje
     ========================================================== */
  .carta {
    position: relative;
    z-index: 4;
    width: min(100%, 30rem);
    padding: clamp(0.85rem, 2.4vh, 1.5rem) clamp(1rem, 4vw, 1.85rem);
    text-align: center;
    border-radius: 1.35rem;
    border: 1px solid rgba(224, 138, 0, 0.35);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(255, 251, 232, 0.92));
    box-shadow:
      0 1.15rem 2.3rem -1.35rem rgba(120, 80, 0, 0.5),
      inset 0 1px 0 #ffffff;
    backdrop-filter: blur(6px);
  }

  .carta__flor {
    display: block;
    width: clamp(2rem, 7vw, 2.6rem);
    aspect-ratio: 1;
    height: auto;
    margin: 0 auto 0.4rem;
    filter: drop-shadow(0 0.35rem 0.4rem rgba(180, 120, 0, 0.35));
  }

  .carta h1 {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(1.45rem, 4.6vw, 2.3rem);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: #6a4405;
  }

  .carta p {
    margin: 0.55rem 0 0;
    font-size: clamp(0.88rem, 2.5vw, 1rem);
    line-height: 1.55;
    color: #7a5a18;
  }

  .carta .separador {
    width: 5rem;
    height: 2px;
    margin: 0.8rem auto 0;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(224, 138, 0, 0), var(--ambar), rgba(224, 138, 0, 0));
  }

  /* ==========================================================
     Ramo
     ========================================================== */
  .ramo {
    position: relative;
    z-index: 2;
    width: min(94vw, 46dvh);
    aspect-ratio: 460 / 620;
    height: auto;
    overflow: visible;
  }

  /* Vaivén suave de todo el arreglo, apoyado en la base del florero */
  .conjunto {
    transform-box: view-box;
    transform-origin: 230px 606px;
    animation: vaiven 9s ease-in-out infinite alternate;
    will-change: transform;
  }

  /* Cada flor se mece desde el punto donde se une a su tallo */
  .mecer {
    transform-box: fill-box;
    transform-origin: 50% 72%;
    animation: mecer var(--vaiven-flor, 6.5s) ease-in-out var(--retardo, 0s) infinite alternate;
    will-change: transform;
  }

  .definiciones {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
  }

  /* ==========================================================
     Pétalos que caen
     ========================================================== */
  .petalos {
    position: absolute;
    inset: 0;
    z-index: 3;
    overflow: hidden;
    pointer-events: none;
  }

  .petalo {
    position: absolute;
    top: -8%;
    left: var(--x, 50%);
    width: var(--tam, 15px);
    height: calc(var(--tam, 15px) * 1.4);
    border-radius: 62% 8% 62% 8%;
    background: linear-gradient(150deg, #fff8cf 0%, #ffe066 42%, #eb9d00 100%);
    box-shadow: 0 0 8px rgba(255, 190, 0, 0.55);
    opacity: 0.92;
    animation: caer var(--dur, 12s) linear var(--retardo, 0s) infinite;
    will-change: transform, opacity;
  }

  /* ==========================================================
     Animaciones
     ========================================================== */
  @keyframes vaiven {
    from {
      transform: rotate(-0.65deg);
    }
    to {
      transform: rotate(0.65deg);
    }
  }

  @keyframes mecer {
    from {
      transform: rotate(-2.8deg);
    }
    to {
      transform: rotate(2.8deg);
    }
  }

  @keyframes caer {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg);
      opacity: 0;
    }
    10% {
      opacity: 0.95;
    }
    55% {
      transform: translate3d(2.4vw, 58dvh, 0) rotate(210deg);
    }
    100% {
      transform: translate3d(-1.6vw, 116dvh, 0) rotate(440deg);
      opacity: 0.9;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .conjunto,
    .mecer,
    .petalo {
      animation: none;
    }
  }
</style>
